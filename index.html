<body>
  <div class="frame" aria-hidden="true"></div>

      <ol class="posters">
        <li>
          <a class="track" href="https://suno.com/song/430347b0-c466-4ba0-8f89-3ceeddca7b03" target="_blank" rel="noopener">
            <img src="./visuals/brand-tests/2026-10-20_test_crocs_poster_v1.jpg" alt="A foam clog printed with palms, sitting on wet pavement at dusk.">
            <span class="shade" aria-hidden="true"></span>
            <span class="track-title">Crocs</span>
          </a>
        </li>
        <li>
          <a class="track" href="https://suno.com/song/36147c6e-328b-40ea-898e-1e7584d0084f" target="_blank" rel="noopener">
